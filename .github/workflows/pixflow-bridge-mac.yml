name: pixflow-bridge-mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pixflow Bridge macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pixflow Design Bridge DMG
        run: pnpm bridge:mac

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: pixflow-design-bridge-mac-${{ matrix.arch }}
          path: dist/bridge-release/packages/*-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 1
