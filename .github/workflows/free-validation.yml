name: Free validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: free-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Free validation
    # No hosted runner usage while private. Enable enforcement only after a
    # real successful public run; a skipped private job is not validation.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Repository guard
        run: pnpm guard
      - name: Typecheck
        run: pnpm typecheck
      - name: Translation consistency
        run: pnpm i18n:check
      - name: Directory attribution
        run: node --import tsx --test scripts/wordpress-directory-notices.test.ts
      - name: Build Free browser assets
        run: pnpm wordpress:web
