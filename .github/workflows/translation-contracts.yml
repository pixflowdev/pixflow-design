name: Translation contracts validation
on:
  pull_request:
    paths:
      - 'apps/daemon/**'
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'wordpress/**'
      - 'e2e/tests/pixflow/bridge-mode-switch.test.ts'
      - '.github/workflows/translation-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm typecheck
      - run: pnpm --filter @open-design/daemon test tests/text-generation.test.ts tests/agent-text-route.test.ts tests/site-translations-cli.test.ts
      - run: pnpm --filter @open-design/daemon test tests/pixflow/workspace-builder-session.test.ts tests/wp-admin-cli.test.ts tests/cli-startup.test.ts
      - run: pnpm --filter @open-design/web test tests/hooks/useLocalAgentHydration.test.tsx tests/components/InlineModelSwitcher.test.tsx tests/components/WorkspaceSidebar.test.tsx tests/pixflow/workspace-config-publish.test.ts
      - run: pnpm --filter @open-design/web test tests/router.navigate.test.tsx tests/pixflow/bridge-request-connectivity.test.ts
      - run: pnpm --dir e2e test tests/pixflow/bridge-mode-switch.test.ts
      - run: php wordpress/tests/bridge-mode-switch.test.php
      - run: pnpm i18n:check
