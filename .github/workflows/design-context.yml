name: Design context validation
on:
  pull_request:
    paths:
      - 'apps/daemon/src/pixflow/**'
      - 'apps/daemon/tests/pixflow/**'
      - 'apps/web/src/pixflow/**'
      - 'apps/web/tests/pixflow/**'
      - 'wordpress/src/Media/**'
      - 'wordpress/assets/design-placeholders/**'
      - 'wordpress/resources/mcp-skills/**'
      - '.github/workflows/design-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm typecheck
      - run: pnpm --filter @open-design/daemon test tests/pixflow/codex-image-fallback.test.ts tests/pixflow/direct-site-run.test.ts tests/pixflow/direct-workspace-path.test.ts tests/pixflow/windows-helper-working-directory.test.ts tests/pixflow/bricks-context-mirror.test.ts
      - run: pnpm --filter @open-design/web test tests/pixflow/editor-style-snapshot.test.ts tests/pixflow/direct-site-byok.test.ts tests/components/assistant-message-tool-status.test.tsx
      - run: php wordpress/tests/design-images.test.php
      - run: pnpm wordpress:web
