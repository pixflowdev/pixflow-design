name: SEO Audit Core validation
on:
  pull_request:
    paths:
      - 'apps/daemon/src/pixflow/public-page-inspection.ts'
      - 'apps/daemon/src/runtimes/text-generation.ts'
      - 'apps/web/src/router.ts'
      - '.github/workflows/seo-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm typecheck
      - name: Browser inspection and review workers
        run: pnpm --filter @open-design/daemon test agent-text-route public-page-inspection text-generation codex-turn codex-voice codex-resume-args tests/runtimes/agent-args.test.ts
      - name: Workspace routing and provider settings
        run: pnpm --filter @open-design/web test last-active-restoration runtime-fetch agentReasoning
      - run: pnpm wordpress:web
