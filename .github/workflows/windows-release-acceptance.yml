name: Windows release installer acceptance
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version
        required: true
        default: '2.3.3'
      previous_version:
        description: Published version to upgrade
        required: true
        default: '2.3.2'
      draft_id:
        description: GitHub draft release ID
        required: true
      source_revision:
        description: Exact 40-character draft source commit
        required: true
      sha256:
        description: Expected installer SHA-256
        required: true
permissions:
  contents: write # GitHub requires write permission to read unpublished release assets.
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      PIXFLOW_QA_VERSION: ${{ inputs.version }}
      PIXFLOW_QA_PREVIOUS_VERSION: ${{ inputs.previous_version }}
      PIXFLOW_QA_DRAFT_ID: ${{ inputs.draft_id }}
      PIXFLOW_QA_SOURCE_REVISION: ${{ inputs.source_revision }}
      PIXFLOW_QA_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install and upgrade the verified installer
        shell: pwsh
        run: ./scripts/windows-release-acceptance.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-acceptance
          path: ${{ runner.temp }}/pixflow-installer-qa/receipt.json
          if-no-files-found: error


