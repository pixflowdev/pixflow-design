name: Native transport prototype

on:
  pull_request:
    branches: [main, codex/optional-native-transport]
    paths:
      - 'tools/pixflow-design-bridge/native-messaging/**'
      - 'tools/pixflow-design-bridge/tests/native-*.test.ts'
      - 'apps/web/src/providers/daemon.ts'
      - 'apps/web/tests/providers/daemon-workspace-handoff.test.ts'
      - 'e2e/ui/native-popup.test.ts'
      - 'e2e/lib/playwright/native.config.ts'
      - 'e2e/tests/pixflow/native-authorization.test.ts'
      - 'e2e/tests/pixflow/native-installer.test.ts'
      - 'tools/pack/src/native-transport.ts'
      - 'tools/pack/src/resources.ts'
      - 'tools/pack/src/win/custom-installer.ts'
      - '.github/workflows/native-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Repository boundaries and types
        run: |
          pnpm guard
          pnpm typecheck
      - name: Native transport permission and disconnect regressions
        run: node --import tsx --test tools/pixflow-design-bridge/tests/native-messaging.test.ts tools/pixflow-design-bridge/tests/native-permissions.test.ts tools/pixflow-design-bridge/tests/native-content.test.ts tools/pixflow-design-bridge/tests/native-status.test.ts tools/pixflow-design-bridge/tests/native-installation.test.ts tools/pixflow-design-bridge/tests/native-load.test.ts
      - name: Installer payload and production authorization boundary
        run: |
          pnpm --filter @open-design/tools-pack test -- tests/native-transport.test.ts tests/resources.test.ts -t 'native|Windows|copyBundled'
          pnpm --dir e2e test tests/pixflow/native-authorization.test.ts
      - name: Native prototype typecheck and build
        run: |
          pnpm exec tsc -p tools/pixflow-design-bridge/native-messaging/tsconfig.json --noEmit
          pnpm exec tsx tools/pixflow-design-bridge/native-messaging/build.ts
      - name: Workspace session header regression
        run: pnpm --filter @open-design/web test tests/providers/daemon-workspace-handoff.test.ts
      - name: Popup interaction and theme checks
        run: |
          pnpm --dir e2e exec playwright install --with-deps chromium
          pnpm --dir e2e exec playwright test --config=lib/playwright/native.config.ts native-popup.test.ts
