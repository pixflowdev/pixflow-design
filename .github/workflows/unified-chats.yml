name: Unified chat validation
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'wordpress/assets/admin/wp-admin-floating-panel.js'
      - '.github/workflows/unified-chats.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Unified chat validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm typecheck
      - run: pnpm --filter @open-design/web test ConversationActions FloatingChatMenu last-active-chat last-active-restoration floating-conversation composer-draft ChatComposer.infinite-render durable-history ProjectView.api-empty-response ProjectView.run-isolation ProjectView.run-cleanup daemon-workspace-handoff daemon-sse-reconnect completed-workspace-run
      - run: pnpm i18n:check
      - run: pnpm wordpress:web
