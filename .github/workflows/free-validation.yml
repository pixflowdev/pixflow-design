name: Free validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: free-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Free validation
    # No hosted runner usage while private. Enable enforcement only after a
    # real successful public run; a skipped private job is not validation.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Repository guard
        run: pnpm guard
      - name: Typecheck
        run: pnpm typecheck
      - name: Bridge diagnostics regression
        run: pnpm --filter @open-design/web test tests/providers/registry.test.ts tests/providers/registry-site-connect.test.ts tests/pixflow/bridge-request-connectivity.test.ts tests/pixflow/bricksAgentFailureBanner.test.tsx tests/pixflow/provider-discovery-state.test.ts tests/components/AvatarMenu.test.tsx tests/pixflow/bridge-site-startup.test.ts tests/pixflow/automatic-bridge-pairing.test.ts tests/pixflow/bridge-update-gate.test.ts tests/pixflow/bridge-url.test.ts
      - name: Translation consistency
        run: pnpm i18n:check
      - name: Reload recovery regression
        run: pnpm --filter @open-design/web test tests/pixflow/direct-run-history.test.ts tests/pixflow/durable-history-races.test.tsx tests/pixflow/wp-admin-direct-storage.test.ts tests/pixflow/direct-site.test.tsx
      - name: Directory packaging regression
        run: node --import tsx --test scripts/wordpress-directory-package.test.ts
      - name: Directory attribution
        run: node --import tsx --test scripts/wordpress-directory-notices.test.ts
      - name: Legacy chat compatibility
        run: php wordpress/tests/workspace-legacy-message.test.php
      - name: Build Free browser assets
        run: pnpm wordpress:web
